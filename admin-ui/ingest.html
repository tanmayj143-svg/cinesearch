<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CineSearch — Ingest</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');
:root{--v:#8b3dff;--violet:#a060ff;--pink:#ff4ec8;--bg:#0a0514;--surface:#120a20;--line:#2a1a38;--fg:#f3e8ff;--fg-dim:#b08dc8;--ok:#5ad18a;--bad:#ff5c8a}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#0a0514 0%,#14082a 60%,#120a20 100%);min-height:100vh;color:var(--fg);font:14px/1.6 Inter,system-ui,sans-serif;padding:24px 20px}
h1{font-size:26px;font-weight:800;color:var(--pink);letter-spacing:-.03em;text-shadow:0 0 30px rgba(255,78,200,.35);margin:0 0 4px}
.sub{font-size:11px;color:var(--fg-dim);letter-spacing:.12em;text-transform:uppercase;margin-bottom:20px}
.card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:22px;box-shadow:0 8px 40px rgba(139,61,255,.1),inset 0 1px 0 rgba(255,255,255,.05);backdrop-filter:blur(6px);max-width:1100px;margin:auto}
label{font-size:10px;color:var(--violet);text-transform:uppercase;letter-spacing:.08em;font-weight:700;margin-bottom:6px;display:block}
input,select{background:#0f0518;border:1px solid #3a2055;color:#fff;border-radius:10px;padding:9px 12px;font:inherit;transition:.15s}input:focus,select:focus{outline:none;border-color:var(--pink);box-shadow:0 0 0 3px rgba(255,78,200,.15)}
button{cursor:pointer;border:0;border-radius:10px;padding:10px 18px;font:600 14px 'Inter';background:linear-gradient(135deg,#8b3dff,#ff4ec8);color:#fff;box-shadow:0 4px 20px rgba(139,61,255,.35);transition:.15s}button:hover{box-shadow:0 6px 30px rgba(255,78,200,.5);transform:translateY(-1px)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.code{font-family:monospace;font-size:12px;color:var(--pink);background:#1a0828;padding:2px 8px;border-radius:6px}
table{width:100%;border-collapse:collapse;font-size:13px}th{color:var(--fg-dim);text-align:left;padding:8px;border-bottom:1px solid var(--line);font-weight:600;text-transform:uppercase;font-size:10px;letter-spacing:.08em}
td{padding:8px;border-bottom:1px solid rgba(255,255,255,.04);vertical-align:middle}
.tag{display:inline-block;background:rgba(255,78,200,.08);color:var(--pink);border:1px solid rgba(255,78,200,.25);border-radius:20px;padding:2px 8px;font-size:11px;font-weight:700;margin-right:6px}
</style></head><body>
<h1>Ingest <span style="font-size:12px;color:var(--violet);font-weight:300">MANAGE FOLDER BATCH</span></h1>
<div class="sub">Choose a folder, label the batch, assign individual File IDs, submit</div>

<div class="card" style="margin-bottom:20px">
  <div class="row" style="gap:14px;flex-wrap:wrap;align-items:flex-end">
    <div style="flex:2;min-width:260px">
      <label for="folder">Library folder (recursive video scan)</label>
      <input id="folder" style="width:100%" placeholder="sources/episode_01/" value="sources/">
    </div>
    <div style="flex:1;min-width:220px">
      <label for="folderPrefix">Batch prefix (applied to each file)</label>
      <input id="folderPrefix" style="width:100%" placeholder="FILM-001_" value="FILM-001_">
    </div>
    <button onclick="scanFolder()">Scan Folder</button>
  </div>
</div>

<div class="card">
  <h2 style="font-size:16px;color:var(--pink);margin:0 0 14px">Eligible Video Files <span style="font-size:11px;color:var(--fg-dim);font-weight:300">(recursive, excludes non-video)</span></h2>
  <table id="fileTable"><thead><tr><th>File</th><th>Path</th><th>Size</th><th>File ID / Label</th></tr></thead><tbody id="fileBody"><tr><td colspan="4" style="color:var(--fg-dim)">Click "Scan Folder" to list eligible video files.</td></tr></tbody></table>
  <div class="row" style="margin-top:16px;justify-content:space-between;align-items:center">
    <div><span style="font-size:11px;color:var(--fg-dim)">Prefix applied: <code id="prefixDisplay" class="code">FILM-001_</code></span></div>
    <button onclick="submitBatch()">Submit Batch Ingest</button>
  </div>
</div>

<script>
let eligible=[];
const videoExts=['.mov','.mp4','.mkv','.avi','.mxf','.m4v','.webm','.mpg','.mpeg'];
function isVideo(name){return videoExts.some(e=>name.toLowerCase().endsWith(e));}
function scanFolder(){
  const folder=document.getElementById('folder').value;
  document.getElementById('prefixDisplay').textContent=document.getElementById('folderPrefix').value||'';
  // Mock eligible from live library (simulating recursive scan)
  eligible=[
    {name:'CLIP_001.mov',path:folder+'CLIP_001.mov',size:'1.2 GB'},
    {name:'SCENE_03.mkv',path:folder+'subfolder/SCENE_03.mkv',size:'850 MB'},
    {name:'TAKE_002.mp4',path:folder+'TAKE_002.mp4',size:'340 MB'},
  ];
  renderList();
}
function renderList(){
  const prefix=document.getElementById('folderPrefix').value;
  const rows=eligible.map(f=>{
    const fileID=prefix+f.name.replace(/\.[^.]+$/,'');
    return `<tr>
      <td><strong style="color:#fff">${f.name}</strong></td>
      <td style="font-size:11px;color:var(--fg-dim);font-family:monospace">${f.path}</td>
      <td><span class="tag">${f.size}</span></td>
      <td><input style="width:100%;min-width:180px" placeholder="File ID / Label" value="${fileID}" data-file="${f.path}"></td>
    </tr>`;
  }).join('');
  document.getElementById('fileBody').innerHTML=eligible.length?rows:`<tr><td colspan="4" style="color:var(--fg-dim)">No eligible video files found in folder.</td></tr>`;
}
function submitBatch(){
  const prefix=document.getElementById('folderPrefix').value;
  const ids=[]; document.querySelectorAll('#fileBody input').forEach(inp=>{if(inp.value.trim()) ids.push({path:inp.dataset.file,id:inp.value.trim(),prefix:prefix});});
  if(!ids.length){alert('No files selected for ingest.');return;}
  // Simulate cleanup + rename logic
  const cleaned=ids.map(i=>`Renamed: ${i.prefix}${i.path.split('/').pop()}`);
  alert('Batch submitted. Cleaned directory would contain only renamed video files:'+ '\n'+cleaned.join('\n'));
}
renderList();
</script>
</div>

<div style="text-align:center;margin-top:20px"><a href="index.html" style="color:var(--violet);text-decoration:none;font-size:12px">← Back to Admin</a></div>

</body></html>
