<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CineSearch — Cinematic Search</title>
<script src="https://unpkg.com/htmx.org@2.0.4"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Space+Grotesk:wght@300;500;700&display=swap');
:root{--gold:#c9a84c;--gold-dim:#8a7330;--amber:#e6a23c;--bg:#06080c;--surface:#0c0e14;--line:#1a1d26;--fg:#e8dcc8;--fg-dim:#7a6e5e;--bad:#e55a4a;--ok:#5ad18a;--acc:#d4af37}
*{box-sizing:border-box}
body{margin:0;background:#06080c;color:var(--fg);font:14px/1.6 'Space Grotesk',system-ui,sans-serif;background-image:radial-gradient(ellipse at 50% 0%,#13101a 0%,#06080c 80%)}
h1{font-family:Cinzel,sans-serif;font-size:22px;color:var(--gold);letter-spacing:.1em;text-shadow:0 0 30px rgba(201,168,76,.3);margin:0}
.subtitle{font-size:11px;color:var(--fg-dim);letter-spacing:.2em;text-transform:uppercase}
#bar{position:sticky;top:0;background:rgba(6,8,12,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:14px 20px;display:flex;gap:10px;align-items:center;z-index:10;box-shadow:0 6px 30px rgba(0,0,0,.6)}
input,select{background:#0a0b10;border:1px solid #23242e;color:var(--fg);border-radius:8px;padding:8px 12px;font:inherit;transition:.15s}input:focus,select:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,168,76,.12);outline:none}
#q{flex:1;font-size:15px}
.btn{background:linear-gradient(180deg,#2a2418,#16130e);border:1px solid rgba(201,168,76,.35);color:var(--gold);border-radius:8px;padding:8px 16px;font:600 13px/1 'Space Grotesk';transition:.15s}
.btn:hover{border-color:rgba(201,168,76,.8);box-shadow:0 0 16px rgba(201,168,76,.2);color:#fff}
#layout{display:grid;grid-template-columns:400px 1fr;gap:0;height:calc(100vh-62px)}
#results{overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;background:#06080c}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;transition:.15s;box-shadow:0 4px 20px rgba(0,0,0,.4)}
.card:hover{border-color:var(--gold);box-shadow:0 0 0 1px rgba(201,168,76,.3),0 8px 30px rgba(0,0,0,.55)}
.card img{width:100%;border-radius:6px;aspect-ratio:16/9;object-fit:cover;background:#000;border:1px solid #131520}
.card .code{font-family:Cinzel,sans-serif;color:var(--gold);font-size:13px;letter-spacing:.06em}
.tags{color:var(--fg-dim);font-size:12px;margin:6px 0 0;line-height:1.3}
.tag-pill{display:inline-block;background:#12131a;border:1px solid #23242e;color:var(--fg-dim);border-radius:4px;padding:1px 6px;font-size:10px;margin-right:4px;margin-top:4px;letter-spacing:.02em}
#player{padding:20px;background:#05070a;overflow-y:auto;border-left:1px solid var(--line)}
video{width:100%;max-height:55vh;background:#000;border-radius:10px;border:1px solid var(--line);box-shadow:0 8px 40px rgba(0,0,0,.7)}
#tl{position:relative;height:80px;margin-top:16px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#080a10}
.blk{position:absolute;top:0;height:100%;border-right:1px solid rgba(255,255,255,.06);background:rgba(201,168,76,.08)}
.blk.sel{background:rgba(201,168,76,.35);outline:2px solid var(--gold)}
#ph{position:absolute;top:0;width:2px;height:100%;background:var(--bad);box-shadow:0 0 8px var(--bad);z-index:2}
#tr{margin-top:16px;font-size:13px;color:var(--fg-dim)}
.ut{padding:6px 10px;border-radius:6px;cursor:pointer;background:#0a0b10;border:1px solid var(--line);margin-bottom:6px;transition:.1s}
.ut:hover{border-color:var(--gold);color:var(--fg)}
.ut.on{border-color:var(--gold);color:var(--fg);background:rgba(201,168,76,.08)}
.row{display:flex;gap:8px;margin-top:14px;align-items:center;flex-wrap:wrap}
</style></head><body>
<div id="bar">
  <h1 style="margin:0">CineSearch <span class="subtitle">SEARCH</span></h1>
  <input id="q" placeholder="Search: 'dolly-in hero', 'whispered tension'…"
    hx-get="/api/search_ui" hx-trigger="keyup changed delay:500ms, search" hx-target="#results"
    hx-include="#filters" name="q">
  <span id="filters">
    <select name="camera_movement" hx-get="/api/search_ui" hx-trigger="change" hx-target="#results" hx-include="#q"><option value="">movement…</option><option>static</option><option>pan</option><option>tilt</option><option>dolly_in</option><option>dolly_out</option><option>tracking</option><option>handheld</option><option>steadicam</option><option>crane</option><option>arc</option></select>
    <select name="shot_size" hx-get="/api/search_ui" hx-trigger="change" hx-target="#results" hx-include="#q"><option value="">size…</option><option>extreme_wide</option><option>wide</option><option>medium</option><option>medium_close_up</option><option>close_up</option><option>extreme_close_up</option></select>
    <select name="mood" hx-get="/api/search_ui" hx-trigger="change" hx-target="#results" hx-include="#q"><option value="">mood…</option><option>tense</option><option>melancholic</option><option>hopeful</option><option>eerie</option><option>joyful</option></select>
  </span>
  <button class="btn" onclick="document.getElementById('q').dispatchEvent(new Event('search'))">Search</button>
  <button class="btn" onclick="location='/admin/'">Admin</button>
</div>
<div id="layout">
  <div id="results" hx-get="/api/search_ui" hx-trigger="load"></div>
  <div id="player"><p style="color:var(--fg-dim)">Select a shot to view timeline, transcript, and file ID.</p></div>
</div>
<script>
async function openShot(id){
  const c=await(await fetch(`/api/shot/${id}/context`)).json();
  const p=document.getElementById('player');
  const dur=Math.max(...c.shots.map(s=>s.b-s.a),1);
  p.innerHTML=`
    <video id="v" controls></video>
    <div id="tl"><img src="${c.waveform}" onerror="this.remove()">
      ${c.shots.map(s=>`<div class="blk ${s.id==id?'sel':''}" style="left:${s.a/dur*100}%;width:${(s.b-s.a)/dur*100}%" title="${s.size||''} ${s.mv||''}" onclick="seek(${s.a})"></div>`).join('')}
      <div id="ph"></div>
    </div>
    <div class="row">
      <button class="btn" onclick="copyCode('${c.code||''}')">Copy ID + TC</button>
      <span id="cc" style="font-family:Cinzel,monospace;font-size:12px;color:var(--gold);letter-spacing:.06em"></span>
      <span style="color:var(--fg-dim);font-size:11px;margin-left:auto">File ID: <code>${c.file_code||'—'}</code></span>
    </div>
    <div id="tr">${c.utterances.map(u=>`<div class="ut" data-a="${u.a}" data-b="${u.b}" onclick="seek(${u.a})">[${fmt(u.a)}] <b>${u.spk||'Speaker'}</b> — ${u.text}</div>`).join('')}</div>`;
  const v=document.getElementById('v');
  if(Hls.isSupported()){const h=new Hls();h.loadSource(c.proxy);h.attachMedia(v);}
  else v.src=c.proxy;
  v.addEventListener('loadedmetadata',()=>v.currentTime=c.shot_tc?c.shot_tc[0]:0);
  v.addEventListener('timeupdate',()=>{
    document.getElementById('ph').style.left=(v.currentTime/dur*100)+'%';
    document.querySelectorAll('.ut').forEach(e=>e.classList.toggle('on',v.currentTime>=+e.dataset.a&&v.currentTime<+e.dataset.b));
  });
}
function seek(t){const v=document.getElementById('v');v.currentTime=t;v.play();}
function copyCode(c){navigator.clipboard.writeText(c);document.getElementById('cc').textContent='Copied: '+c;}
function fmt(s){const h=String(Math.floor(s/3600)).padStart(2,'0'),m=String(Math.floor(s%3600/60)).padStart(2,'0'),x=(s%60).toFixed(2).padStart(5,'0');return`${h}:${m}:${x}`;}
</script>
</body></html>
