<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CineSearch</title>
<script src="https://unpkg.com/htmx.org@2.0.4"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
<style>
:root{--bg:#0e1116;--panel:#171c24;--line:#262e3a;--fg:#d7dee8;--dim:#7d8896;--acc:#4da3ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 system-ui}
#bar{position:sticky;top:0;background:var(--panel);padding:10px 16px;display:flex;gap:8px;border-bottom:1px solid var(--line);z-index:5}
input,select{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:8px}
#q{flex:1;font-size:15px}
#layout{display:grid;grid-template-columns:380px 1fr;gap:0;height:calc(100vh - 53px)}
#results{overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;cursor:pointer;padding:8px}
.card:hover{border-color:var(--acc)}
.card img{width:100%;border-radius:4px;aspect-ratio:16/9;object-fit:cover;background:#000}
.code{color:var(--acc);font-family:ui-monospace,monospace;font-size:12px}
.tags{color:var(--dim);font-size:12px;margin-top:4px}
#player{padding:16px;overflow-y:auto}
video{width:100%;max-height:55vh;background:#000;border-radius:8px}
#tl{position:relative;height:70px;margin-top:12px;border:1px solid var(--line);border-radius:6px;overflow:hidden}
#tl img{position:absolute;inset:0;width:100%;height:100%;opacity:.5}
.blk{position:absolute;top:0;height:100%;border-right:1px solid #0006}
.blk.sel{background:#4da3ff44;outline:2px solid var(--acc)}
#ph{position:absolute;top:0;width:2px;height:100%;background:#ff5c5c;pointer-events:none}
#tr{margin-top:12px;font-size:13px}
.ut{padding:2px 6px;border-radius:4px;cursor:pointer}
.ut:hover{background:var(--panel)}.ut.on{background:#4da3ff33}
.btn{background:var(--acc);color:#000;border:0;border-radius:6px;padding:8px 14px;cursor:pointer;font-weight:600}
.btn.ghost{background:transparent;color:var(--acc);border:1px solid var(--acc)}
.row{display:flex;gap:8px;margin-top:10px;align-items:center}
</style></head><body>
<div id="bar">
  <input id="q" placeholder="Search: 'tense whispered argument', 'dolly-in hero shot'…"
    hx-get="/api/search_ui" hx-trigger="keyup changed delay:500ms, search" hx-target="#results"
    hx-include="#filters" name="q">
  <span id="filters">
    <select name="camera_movement" hx-get="/api/search_ui" hx-trigger="change" hx-target="#results" hx-include="#q">
      <option value="">movement…</option><option>static</option><option>pan</option><option>tilt</option>
      <option>dolly_in</option><option>dolly_out</option><option>tracking</option><option>handheld</option>
      <option>steadicam</option><option>crane</option><option>arc</option>
    </select>
    <select name="shot_size" hx-get="/api/search_ui" hx-trigger="change" hx-target="#results" hx-include="#q">
      <option value="">shot size…</option><option>extreme_wide</option><option>wide</option>
      <option>medium</option><option>medium_close_up</option><option>close_up</option><option>extreme_close_up</option>
    </select>
  </span>
  <button class="btn ghost" onclick="location='/admin/'">admin</button>
</div>
<div id="layout">
  <div id="results" hx-get="/api/search_ui" hx-trigger="load"></div>
  <div id="player"><p style="color:var(--dim)">Select a shot.</p></div>
</div>
<script>
async function openShot(id){
  const c = await (await fetch(`/api/shot/${id}/context`)).json();
  const p = document.getElementById('player');
  const dur = Math.max(...c.shots.map(s=>s.b));
  p.innerHTML = `
    <video id="v" controls></video>
    <div id="tl"><img src="${c.waveform}" onerror="this.remove()">
      ${c.shots.map(s=>`<div class="blk ${s.id==id?'sel':''}" style="left:${s.a/dur*100}%;width:${(s.b-s.a)/dur*100}%"
        title="${s.size||''} ${s.mv||''}" onclick="seek(${s.a})"></div>`).join('')}
      <div id="ph"></div>
    </div>
    <div class="row">
      <button class="btn" onclick="copyCode('${c.code||''}')">copy ID+TC</button>
      <span id="cc" class="code"></span>
    </div>
    <div id="tr">${c.utterances.map(u=>`<div class="ut" data-a="${u.a}" data-b="${u.b}"
        onclick="seek(${u.a})">[${fmt(u.a)}] ${u.text}</div>`).join('')}</div>`;
  const v = document.getElementById('v');
  if (Hls.isSupported()){ const h=new Hls(); h.loadSource(c.proxy); h.attachMedia(v); }
  else v.src = c.proxy;
  v.addEventListener('loadedmetadata',()=>v.currentTime=c.shot_tc[0]);
  v.addEventListener('timeupdate',()=>{
    document.getElementById('ph').style.left = (v.currentTime/dur*100)+'%';
    document.querySelectorAll('.ut').forEach(e=>
      e.classList.toggle('on', v.currentTime>=+e.dataset.a && v.currentTime<+e.dataset.b));
  });
}
function seek(t){ const v=document.getElementById('v'); v.currentTime=t; v.play(); }
function copyCode(c){ navigator.clipboard.writeText(c); document.getElementById('cc').textContent='copied: '+c; }
function fmt(s){ const h=String(Math.floor(s/3600)).padStart(2,'0'),m=String(Math.floor(s%3600/60)).padStart(2,'0'),x=(s%60).toFixed(2).padStart(5,'0'); return `${h}:${m}:${x}`; }
</script>
</body></html>
